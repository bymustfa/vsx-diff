name: Feature request
description: A change that would make vsx-diff more useful.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Tell us the job you are trying to do. A short scene is more useful than a list of flags.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting
      description: When does the current tool fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like instead
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What else did you consider
      description: Other commands, scripts, or tools you already tried.
    validations:
      required: false
