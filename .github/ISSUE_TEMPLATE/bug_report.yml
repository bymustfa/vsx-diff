name: Bug report
description: vsx-diff did something you did not expect.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for writing this down. Leave out tokens, private keys, and anything else you would not paste in public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and what the tool printed or did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: vsx-diff version
      description: Output of `vsx-diff --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.14.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Extension id, versions, flags, and whether this was Open VSX, the Marketplace, or local VSIX files.
    validations:
      required: true
